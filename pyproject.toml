# ==============================================================================
# vn-portfolio-frontier — Package config, formatter, linter, test settings
# ==============================================================================

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ------------------------------------------------------------------------------
# Package metadata
# ------------------------------------------------------------------------------

[project]
name = "vn-portfolio-frontier"
version = "0.1.0"
description = "Efficient Frontier extension with auto-rebalancing and PhoBERT sentiment signals for Vietnamese equity portfolios"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mai Công Trà Giang (MCTGiang)" }]
keywords = [
    "portfolio-optimization",
    "vietnamese-stocks",
    "modern-portfolio-theory",
    "efficient-frontier",
    "phobert",
    "sentiment-analysis",
    "vn30",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pandas>=3.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "streamlit>=1.40",
    "plotly>=5.24",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "vnstock>=3.0,<5.0",
    "yfinance>=0.2,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[project.urls]
Homepage = "https://github.com/MCTGiang/vn-portfolio-frontier"
Repository = "https://github.com/MCTGiang/vn-portfolio-frontier"
Issues = "https://github.com/MCTGiang/vn-portfolio-frontier/issues"
"Related — Project 1" = "https://github.com/MCTGiang/vn-portfolio-optimizer"

# ------------------------------------------------------------------------------
# Setuptools — src-layout
# ------------------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["src"]
include = ["vn_portfolio_frontier*"]

# ------------------------------------------------------------------------------
# Black — formatter
# ------------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]
include = '\.pyi?$'

# ------------------------------------------------------------------------------
# Ruff — linter (plus isort via I select)
# ------------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line too long — handled by black

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]  # test names may violate PEP 8

# ------------------------------------------------------------------------------
# pytest — markers inherited from Project 1
# ------------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=vn_portfolio_frontier",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
testpaths = ["tests"]
markers = [
    "unit: fast unit tests, no external I/O",
    "integration: integration tests, may hit DB or network",
    "slow: tests that take >5s",
    "edge_case: edge case regression tests",
    "regression: regression tests for known bugs",
]

# ------------------------------------------------------------------------------
# Coverage config
# ------------------------------------------------------------------------------

[tool.coverage.run]
source = ["src/vn_portfolio_frontier"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
