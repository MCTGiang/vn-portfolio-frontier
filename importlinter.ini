; ============================================================================
; import-linter contract file — enforces Hexagonal Architecture (ADR-015)
; ============================================================================
; Runs via pre-commit hook on every commit + CI gate.
;
; 3 contracts enforce dependency direction:
;   1. domain-purity: domain layer forbidden from importing outer layers
;   2. application-services-no-infra: services depend on ports (abstraction),
;      not concrete infrastructure
;   3. ports-no-infra: port interfaces forbidden from importing infrastructure
;
; Notes:
; - Day 1: skeleton has no code yet, contracts pass trivially
; - Day 2+: contracts catch any violation as code grows
; - config.py + db.py at root are legacy modules, not in Hexagonal layers
;   (will migrate to infrastructure/config and infrastructure/db in Day 2+
;    when sync_prices.py etc. are refactored)
; - Factory (application/factory.py Day 2+) CAN import infrastructure for
;   wiring; not covered by current contracts since it is a single wire-up
;   point by design (ADR-015 §2.5)
; ============================================================================

[importlinter]
root_package = vn_portfolio_frontier


[importlinter:contract:domain-purity]
name = Domain must not import from application / infrastructure / interface
type = forbidden
source_modules =
    vn_portfolio_frontier.domain
forbidden_modules =
    vn_portfolio_frontier.application
    vn_portfolio_frontier.infrastructure
    vn_portfolio_frontier.interface


[importlinter:contract:application-services-no-infra]
name = Application services must depend on ports, not concrete infrastructure
type = forbidden
source_modules =
    vn_portfolio_frontier.application.services
forbidden_modules =
    vn_portfolio_frontier.infrastructure


[importlinter:contract:ports-no-infra]
name = Application ports (Protocol interfaces) must not import infrastructure
type = forbidden
source_modules =
    vn_portfolio_frontier.application.ports
forbidden_modules =
    vn_portfolio_frontier.infrastructure
